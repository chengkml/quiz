name: Quiz构建发布

on:
  push:
    branches:
      - main
# 并发控制：同组 workflow 新触发时会取消正在运行的旧构建
concurrency:
  group: build-and-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v3

      - name: 检查 start.sh
        run: ls -l ./start.sh

      - name: 配置Node
        uses: actions/setup-node@v3
        with:
          node-version: '16.13.1'

      - name: 缓存Yarn依赖
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: 构建前端
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: 配置Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.4'   # 可以根据你的项目需求指定版本

      - name: 缓存Gradle构建
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 拷贝前端文件
        run: |
          mkdir -p backend/src/main/resources/static
          cp -r frontend/dist/* backend/src/main/resources/static/

      - name: 构建后端Jar
        working-directory: backend
        run: gradle clean build -x test

      - name: 上传 start.sh
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "start.sh"
          target: "/opt/quiz/"

      - name: 上传后端Jar
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "backend/build/libs/quiz-1.0.0.jar"
          target: "/opt/quiz/"
          strip_components: 3

      - name: Restart server service
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            chmod +x /opt/quiz/start.sh        # 确保脚本可执行
            /bin/bash /opt/quiz/start.sh       # 执行脚本启动服务
