server:
  port: 8089
  servlet:
    context-path: /quiz
    session:
      timeout: 8h
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        secure: true
        same-site: none
  forward-headers-strategy: framework

spring:
  application:
    name: quiz
  # 默认为开发环境，可通过环境变量 SPRING_PROFILES_ACTIVE 或启动参数覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# 日志配置
logging:
  level:
    com.ck: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  config: classpath:logback-spring.xml

quiz:
  file:
    storage-type: local # local, sftp, s3
    local:
      base-path: ./data/files
    sftp:
      host: localhost
      port: 22
      username: user
      password: password
      private-key: 
      base-path: /upload
    s3:
      access-key: minioadmin
      secret-key: minioadmin
      region: us-east-1
      bucket: mybucket
      endpoint: http://localhost:9000
      base-path:

  git:
    base-path: ./data/git_repos # Base directory for all Git repositories

  hot-search:
    enabled: true
    fixed-delay-ms: 300000
    schedule-tick-ms: 60000
    initial-delay-ms: 30000
    default-source: TOUTIAO

springdoc:
  api-docs:
    path: /api/v3/api-docs
