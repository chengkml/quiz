server:
  port: 8089
  servlet:
    context-path: /quiz
    session:
      timeout: 8h
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        secure: true
        same-site: none
  forward-headers-strategy: framework

spring:
  application:
    name: quiz
  profiles:
    active: prod
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  
  # 数据库配置 - 可以在这里覆盖核心模块的配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://223.109.142.84:5432/postgres?currentSchema=public
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1qazZAQ!}
    
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
      javax:
        persistence:
          default:
            schema: public
  ai:
    openai:
      base-url: https://api.siliconflow.cn
      api-key: sk-wiljwnkqhwubaiajzfsfjdlcaqewstqaifvpgccbquemimpe
      chat:
        options:
          model: Pro/deepseek-ai/DeepSeek-V3.2-Exp

# 日志配置
logging:
  level:
    com.ck: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  config: classpath:logback-spring.xml