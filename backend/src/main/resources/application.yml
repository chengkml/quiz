server:
  port: 8089
  servlet:
    context-path: /quiz
    session:
      timeout: 8h
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        secure: true
        same-site: none
  forward-headers-strategy: framework

spring:
  application:
    name: quiz
  # 默认为开发环境，可通过环境变量 SPRING_PROFILES_ACTIVE 或启动参数覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# 日志配置
logging:
  level:
    com.ck: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  config: classpath:logback-spring.xml