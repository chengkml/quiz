spring:
  # 数据库配置 - 生产环境
  datasource:
    driver-class-name: org.postgresql.Driver
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=${DB_SCHEMA:public}"
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1qazZAQ!}
    hikari:
      auto-commit: true
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    
  # JPA配置 - 生产环境
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false       # 生产环境不显示 SQL
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          fetch_size: 100
          batch_size: 20
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        # 生产环境性能优化
        generate_statistics: false
        use_sql_comments: false
      javax:
        persistence:
          default:
            schema: ${DB_SCHEMA:public}

  # AI 配置 - 生产环境
  ai:
    openai:
      base-url: "https://api.siliconflow.cn"
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: Pro/deepseek-ai/DeepSeek-V3.2-Exp

